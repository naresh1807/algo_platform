version: "3.9"

# Only the two stateful services this platform needs locally: MySQL
# (the system of record, per the manual's tech stack) and Redis (backs
# both Channels and Celery). Django and the React dev server are run
# directly on the host (see README) rather than containerized here --
# that keeps `manage.py runserver`/`npm run dev`'s fast reload working
# without volume-mount overhead, and is the simplest setup for a
# personal single-operator platform. Add app containers later if this
# ever needs to run somewhere other than your own machine.

services:
  # Credentials come from docker/.env (see docker/.env.example -- copy it
  # to docker/.env and fill in real values, same convention as
  # backend/.env.example). docker/.env is gitignored, same as backend/.env.
  #
  # SECURITY NOTE: this file previously had REAL credentials hardcoded
  # directly here and was committed to git -- see this repo's own
  # incident report for the exact values and the required manual
  # rotation steps. Never hardcode a real secret in this file again;
  # docker-compose reads docker/.env automatically when it sits next to
  # this file, so there is no reason to.
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-algo_trading}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in docker/.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
